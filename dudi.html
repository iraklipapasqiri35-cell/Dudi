<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUDI Store</title>
    <style>
        /* ლოგოს ფერების პალიტრა */
        :root {
            --primary-blue: #0b3cc1;
            --primary-pink: #ff0080;
            --light-bg: #f4f7fc;
            --white: #ffffff;
            --text-dark: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
        }

        /* ნავიგაციის ზოლი (Header) */
        header {
            background-color: var(--primary-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* ლოგოს სექცია მარცხნივ */
        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-img {
            height: 55px; /* ლოგოს ზომა */
            width: auto;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.05);
        }

        /* მენიუს ბმულები */
        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--primary-pink);
        }

        /* SHOP ღილაკი */
        .shop-btn {
            background: linear-gradient(135deg, var(--primary-pink), #e00070);
            color: var(--white);
            padding: 10px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 0, 128, 0.3);
            transition: all 0.3s ease;
        }

        .shop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 0, 128, 0.5);
        }

        /* მთავარი სექცია */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 8%;
            min-height: 80vh;
        }

        .hero-content {
            max-width: 500px;
        }

        .hero-content h1 {
            font-size: 42px;
            color: var(--primary-blue);
            margin-bottom: 15px;
        }

        .hero-content p {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* ღილაკი Add to Cart */
        .add-cart-btn {
            border: 2px solid var(--primary-pink);
            color: var(--primary-pink);
            background: transparent;
            padding: 12px 30px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-cart-btn:hover {
            background-color: var(--primary-pink);
            color: var(--white);
        }

        /* ფუტერი (Footer) */
        footer {
            background-color: var(--primary-blue);
            color: var(--white);
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <!-- მარცხენა მხარეს ლოგო -->
        <a href="#" class="logo-container">
            <!-- ჩასვი შენი ლოგოს ფაილის სახელი src-ში -->
            <img src="logo.png" alt="DUDI Logo" class="logo-img">
        </a>

        <!-- მენიუ -->
        <nav>
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">PRODUCTS</a></li>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">CONTACT</a></li>
            </ul>
        </nav>

        <a href="#" class="shop-btn">SHOP</a>
    </header>

    <main class="hero">
        <div class="hero-content">
            <h1>Dudi Device</h1>
            <p>Features small and various smart devices with top quality design and experience.</p>
            <button class="add-cart-btn">Add to Cart</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 DUDI Store. All rights reserved.</p>
    </footer>

</body>
</html>
</script>
</body>
</html>
